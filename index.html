    <script>

            { name: "Ванпанчмен", emojis: "👨‍𲀦🥊" },
            { name: "Берсерк", emojis: "🗡️🌑" },
            { name: "Евангелион", emojis: "🤖🛑" },
            { name: "Хвост Феи", emojis: "🧚‍♂️🔥" },
            { name: "Клинок Бессмертного", emojis: "🩸⚔️" },
            { name: "Черный Клевер", emojis: "🍀📖" },
            { name: "Доктор Стоун", emojis: "🧪🔬" },
            { name: "Человек-бензопила", emojis: "🪚😈" },
            { name: "Клинок, рассекающий демонов", emojis: "🌊👺" },
            { name: "Борьба в прямом эфире", emojis: "📹👊" },
            { name: "Токийские мстители", emojis: "🏍️🕰️" },
            { name: "Семья шпиона", emojis: "🥜🕵️‍♂️" },
            { name: "Синий тюремный блок: Блю Лок", emojis: "⚽🥅" },
            { name: "Клинок падшего короля", emojis: "👑⚔️" },

            { name: "Клинок времени", emojis: "⏳🗡️" },
            { name: "Обещанная Страна Снов", emojis: "👶🚪" },
            { name: "Баскетбол Куроко", emojis: "🏀🔥" },

            { name: "Великий из бродячих псов", emojis: "🐅📖" },
            { name: "Ангельские ритмы", emojis: "👼🎵" },
            { name: "Клинок убийцы", emojis: "🗡️🖤" },
            { name: "Оверлорд", emojis: "💀👑" },
            { name: "Реинкарнация безработного", emojis: "🪄👶" },
            { name: "Класс убийц", emojis: "🐙🏫" }
        ];

        let score = 0;
        let level = 1;
        let currentCorrect = "";

        function nextQuestion() {
            let correctObj = animeList[Math.floor(Math.random() * animeList.length)];
            currentCorrect = correctObj.name;
            
            document.getElementById("question").innerText = correctObj.emojis;
            document.getElementById("stats").innerText = `Уровень: ${level} | Очки: ${score}`;
            document.getElementById("msg").innerText = "";

            let options = [currentCorrect];
            while(options.length < 4) {
                let randomObj = animeList[Math.floor(Math.random() * animeList.length)];
                if(!options.includes(randomObj.name)) {
                    options.push(randomObj.name);
                }
            }

            options.sort(() => Math.random() - 0.5);

            let optsDiv = document.getElementById("options");
            optsDiv.innerHTML = "";
            options.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            let msg = document.getElementById("msg");
            if (selected === currentCorrect) {
                msg.style.color = "#4ade80";
                msg.innerText = "Правильно! 🎉";
                score += 10;
                level++;
                setTimeout(nextQuestion, 800);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "Неправильно! ❌";
                setTimeout(nextQuestion, 800);
            }
        }

        nextQuestion();
    </script>
