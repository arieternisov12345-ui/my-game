<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай Аниме: Викторина</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #16213e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #0f3460;
        }
        h1 { color: #e94560; font-size: 22px; margin-bottom: 5px; }
        p { color: #b2bec3; font-size: 13px; }
        .anime-image-box {
            width: 100%;
            height: 180px;
            background: #0f3460;
            border-radius: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px dashed #e94560;
        }
        .message {
            font-size: 14px;
            height: 22px;
            margin: 10px 0;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .option-btn {
            background: #0f3460;
            color: white;
            border: 2px solid #e94560;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .option-btn:active { transform: scale(0.98); background: #e94560; }
        .score { font-size: 15px; color: #fdcb6e; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Угадай Аниме</h1>
        <p>Выберите правильное название аниме!</p>
        
        <div class="score">Уровень: <span id="level">1</span> | Очки: <span id="score">0</span></div>
        
        <!-- Аниме сүрөтү же эмодзи көрсөтүлө турган жер -->
        <div class="anime-image-box" id="animeEmoji">👺</div>
        
        <div class="message" id="msgText"></div>
        
        <!-- 4 вариант аттары -->
        <div class="options" id="optionsContainer"></div>
    </div>

    <script>
        // Анимелер базасы: сүрөт ордуна эмодзи/символ, туура жооп жана 4 вариант
        const levels = [
            { emoji: "📓🖊️", correct: "Тетрадь Смерти", options: ["Наруто", "Тетрадь Смерти", "Блич", "Ван Пис"] },
            { emoji: "🍜🍥", correct: "Наруто", options: ["Наруто", "Атака Титанов", "Ванпанчмен", "Токийский Гуль"] },
            { emoji: "⚔️🔥", correct: "Клинок, рассекающий демонов", options: ["Магическая битва", "Клинок, рассекающий демонов", "Блич", "Хвост Феи"] },
            { emoji: "💀🧱", correct: "Атака Титанов", options: ["Клинок, рассекающий демонов", "Атака Титанов", "Морской бой", "Тетрадь Смерти"] },
            { emoji: "👊⚡", correct: "Ванпанчмен", options: ["Наруто", "Ван Пис", "Ванпанчмен", "Блич"] },
            { emoji: "🏴‍☠️👒", correct: "Ван Пис", options: ["Ван Пис", "Пираты Карибского моря", "Блич", "Хантер х Хантер"] }
        ];

        let currentLevelIndex = 0;
        let score = 0;

        function loadLevel() {
            let currentObj = levels[currentLevelIndex];
            
            document.getElementById("animeEmoji").innerText = currentObj.emoji;
            document.getElementById("level").innerText = currentLevelIndex + 1;
            document.getElementById("score").innerText = score;
            document.getElementById("msgText").innerText = "";

            let container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            // Варианттарды аралаштыруу
            let shuffledOptions = [...currentObj.options];
            shuffledOptions.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(optionText => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(optionText, currentObj.correct, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            let msg = document.getElementById("msgText");
            
            if (selected === correct) {
                score += 15;
                msg.style.color = "#2ecc71";
                msg.innerText = "Верно! Отлично!";
                btn.style.background = "#27ae60";
                
                currentLevelIndex++;
                setTimeout(() => {
                    if (currentLevelIndex < levels.length) {
                        loadLevel();
                    } else {
                        msg.style.color = "#fdcb6e";
                        msg.innerText = "Поздравляем! Вы прошли всю викторину!";
                        currentLevelIndex = 0;
                        setTimeout(loadLevel, 3000);
                    }
                }, 1000);
            } else {
                msg.style.color = "#e94560";
                msg.innerText = "Неправильно! Попробуйте снова.";
                btn.style.background = "#c0392b";
            }
        }

        loadLevel();
    </script>

</body>
</html>
