<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Car Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .car-card {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 300px;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #00fff5;
            margin-bottom: 15px;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="car-card">
        <h2>🏎️ Race Mini App</h2>
        <div class="score">Упай: <span id="score">0</span></div>
        <button class="btn" onclick="addScore()">ГАЗДЫ БАС! 🚀</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Экраны толук ачуу

        let count = 0;
        function addScore() {
            count += 10;
            document.getElementById("score").innerText = count;
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium'); // Вибрация берүү
            }
        }
    </script>
