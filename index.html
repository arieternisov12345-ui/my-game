<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Russia: RP Life</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        h1 { color: #f1c40f; font-size: 24px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .stats {
            background: #252525;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            border-left: 4px solid #f1c40f;
            line-height: 1.6;
        }
        .stats b { color: #f39c12; }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: #27ae60; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .btn-blue { background: #2980b9; box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3); }
        .btn-purple { background: #8e44ad; box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3); }
        .shop-section {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
            text-align: left;
        }
        .shop-section h3 { font-size: 16px; color: #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Black Russia RP</h1>
        
        <div class="stats" id="stats">
            👤 Игрок: <b>Aka_Belom</b><br>
            💰 Наличные: <span id="money">5000</span> ₽<br>
            🏦 Банк: <span id="bank">0</span> ₽<br>
            🚗 Автомобиль: <span id="car">Пешком</span><br>
            ⭐ Ранг / Масть: <span id="rank">Новичок</span>
        </div>

        <button class="btn btn-green" onclick="work()">💼 Работать (Заработать)</button>
        <button class="btn btn-blue" onclick="crime()">🔫 Криминал (ОПГ / Риск)</button>
        
        <div class="shop-section">
            <h3>🚗 Автосалон</h3>
            <button class="btn" onclick="buyCar('Toyota Camry 3.5', 45000)">Купить Camry 3.5 (45,000 ₽)</button>
            <button class="btn btn-purple" onclick="buyCar('Mercedes Geländewagen', 150000)">Купить Geländewagen (150,000 ₽)</button>
        </div>
    </div>

    <script>
        let money = 5000;
        let bank = 0;
        let car = "Пешком";
        let rank = "Новичок (1 ранг)";

        function updateStats() {
            document.getElementById("money").innerText = money.toLocaleString();
            document.getElementById("bank").innerText = bank.toLocaleString();
            document.getElementById("car").innerText = car;
            document.getElementById("rank").innerText = rank;
        }

        function work() {
            let earned = Math.floor(Math.random() * 2000) + 1000;
            money += earned;
            
            if (money > 30000 && rank.includes("Новичок")) {
                rank = "Свой человек (3 ранг)";
            }
            if (money > 100000) {
                rank = "Авторитет (7 ранг)";
            }
            
            updateStats();
            alert(`Вы успешно отработали смену и заработали ${earned.toLocaleString()} ₽!`);
        }

        function crime() {
            let success = Math.random() > 0.4; // 60% шанс успеха
            if (success) {
                let looted = Math.floor(Math.random() * 4000) + 2000;
                money += looted;
                updateStats();
                alert(`Успешное дело! Вы заработали криминальным путем ${looted.toLocaleString()} ₽.`);
            } else {
                let fine = 1500;
                money = Math.max(0, money - fine);
                updateStats();
                alert(`Вас задержала полиция! Штраф ${fine} ₽.`);
            }
        }

        function buyCar(carName, price) {
            if (money >= price) {
                money -= price;
                car = carName;
                updateStats();
                alert(`Поздравляем! Вы приобрели ${carName}!`);
            } else {
                alert("Недостаточно наличных средств! Поработайте еще.");
            }
        }
    </script>

</body>
</html>
