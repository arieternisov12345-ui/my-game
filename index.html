<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слова Чудес: Мобильная игра</title>
    <style>
        body {
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #2a2a40;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        h1 { color: #f1c40f; font-size: 20px; margin-bottom: 5px; }
        p { color: #aaa; font-size: 14px; }
        .word-slot {
            font-size: 24px;
            letter-spacing: 5px;
            margin: 20px 0;
            background: #1b1b29;
            padding: 10px;
            border-radius: 8px;
            border: 2px dashed #f1c40f;
            color: #2ecc71;
            font-weight: bold;
        }
        .letters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .letter-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .letter-btn:active { transform: scale(0.9); background: #2980b9; }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-green { background: #27ae60; }
        .score { font-size: 16px; color: #f39c12; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Слова Чудес</h1>
        <p>Собери слово из предложенных букв!</p>
        
        <div class="score">Уровень: <span id="level">1</span> | Очки: <span id="score">0</span></div>
        
        <div class="word-slot" id="currentWord">___</div>
        
        <div class="letters" id="letterContainer">
            <!-- Тамгалар динамикалык чыгат -->
        </div>

        <div>
            <button class="btn btn-green" onclick="checkWord()">Текшерүү</button>
            <button class="btn" onclick="clearWord()">Тазалоо</button>
        </div>
    </div>

    <script>
        // Жөнөкөй деңгээлдер жана сөздөр базасы
        const levels = [
            { letters: ["К", "О", "Т"], words: ["КОТ", "ТОК"] },
            { letters: ["М", "И", "Р"], words: ["МИР", "РИМ"] },
            { letters: ["Ш", "А", "Р"], words: ["ШАР", "РАШ"] },
            { letters: ["Д", "О", "М"], words: ["ДОМ", "МОД"] }
        ];

        let currentLevelIndex = 0;
        let score = 0;
        let selectedWord = "";

        function loadLevel() {
            selectedWord = "";
            document.getElementById("currentWord").innerText = "___";
            document.getElementById("level").innerText = currentLevelIndex + 1;
            document.getElementById("score").innerText = score;

            let container = document.getElementById("letterContainer");
            container.innerHTML = "";

            let currentLetters = levels[currentLevelIndex].letters;
            // Тамгалардын ордун аралаштыруу
            currentLetters.sort(() => Math.random() - 0.5);

            currentLetters.forEach(letter => {
                let btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = letter;
                btn.onclick = () => addLetter(letter);
                container.appendChild(btn);
            });
        }

        function addLetter(letter) {
            if (selectedWord.length < 3) {
                selectedWord += letter;
                document.getElementById("currentWord").innerText = selectedWord;
            }
        }

        function clearWord() {
            selectedWord = "";
            document.getElementById("currentWord").innerText = "___";
        }

        function checkWord() {
            let validWords = levels[currentLevelIndex].words;
            if (validWords.includes(selectedWord)) {
                score += 10;
                alert("Туура! Молодец!");
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    loadLevel();
                } else {
                    alert("Куттуктайм! Бардык деңгээлдерден өттүңүз!");
                    currentLevelIndex = 0;
                    loadLevel();
                }
            } else {
                alert("Мындай сөз жок же ката! Кайра аракет кыл.");
                clearWord();
            }
        }

        // Башталышы
        loadLevel();
    </script>

</body>
</html>
