<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай Аниме: Мега Викторина 500+</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 33, 62, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #e94560;
            box-sizing: border-box;
        }
        h1 { color: #ff4757; font-size: 22px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(233,69,96,0.5); }
        p { color: #a4b0be; font-size: 13px; margin-bottom: 15px; }
        
        .anime-image-box {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #1f4068, #162447);
            border-radius: 14px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            border: 2px solid #00cec9;
            box-shadow: inset 0 0 15px rgba(0,206,201,0.3), 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .message {
            font-size: 15px;
            height: 24px;
            margin: 10px 0;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .option-btn {
            background: #1f4068;
            color: white;
            border: 2px solid #e94560;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .option-btn:active { transform: scale(0.97); background: #e94560; }
        .score { font-size: 15px; color: #ffd32a; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Угадай Аниме</h1>
        <p>Мега-викторина: 500+ комбинаций!</p>
        
        <div class="score">Уровень: <span id="level">1</span> | Очки: <span id="score">0</span></div>
        
        <div class="anime-image-box" id="animeEmoji">🔥</div>
        
        <div class="message" id="msgText"></div>
        
        <div class="options" id="optionsContainer"></div>
    </div>

    <script>
        // Кеңейтилген чоң анимелер базасы (жүздөгөн мүмкүнчүлүктөр үчүн)
        const animeDatabase = [
            { name: "Тетрадь Смерти", emoji: "📓🖊️" },
            { name: "Наруто", emoji: "🍜🍥" },
            { name: "Клинок, рассекающий демонов", emoji: "⚔️🔥" },
            { name: "Атака Титанов", emoji: "💀🧱" },
            { name: "Ванпанчмен", emoji: "👊⚡" },
            { name: "Ван Пис", emoji: "🏴‍☠️👒" },
            { name: "Токийский Гуль", emoji: "☕👁️" },
            { name: "Магическая битва", emoji: "🖐️⚡" },
            { name: "Блич", emoji: "🗡️🖤" },
            { name: "Хвост Феи", emoji: "🔥📜" },
            { name: "Волейбол", emoji: "🎾🏆" },
            { name: "Баскетбол Куроко", emoji: "🏀🔥" },
            { name: "Нет игры — нет жизни", emoji: "👑♟️" },
            { name: "Доктор Стоун", emoji: "🧪🔬" },
            { name: "Мастера Меча Онлайн", emoji: "⚔️🛡️" },
            { name: "Моя геройская академия", emoji: "🦸‍♂️💥" },
            { name: "Хантер х Хантер", emoji: "👁️‍🗨️🌀" },
            { name: "Вайолет Эвергарден", emoji: "⛓️🌹" },
            { name: "Звездное дитя", emoji: "⭐👁️" },
            { name: "Сага о Винланде", emoji: "🪓🌳" },
            { name: "Евангелион", emoji: "🤖💜" },
            { name: "Берсерк", emoji: "⚔️🌑" },
            { name: "Кагуя-сама", emoji: "❤️💌" },
            { name: "Токийские мстители", emoji: "🏍️👊" },
            { name: "Клинок бродяги", emoji: "🗡️🌸" }
        ];

        let currentLevelIndex = 0;
        let score = 0;
        let totalLevels = 500; // Жалпы деңгээлдердин саны 500ге чейин жеткирилди!
        let currentQuestion = {};

        function loadLevel() {
            if (currentLevelIndex >= totalLevels) {
                currentLevelIndex = 0; // Кайра башынан башталат же чексиз айланат
            }

            document.getElementById("level").innerText = currentLevelIndex + 1;
            document.getElementById("score").innerText = score;
            document.getElementById("msgText").innerText = "";

            // Базадан туура анимени кокусунан тандап алабыз
            let correctObj = animeDatabase[Math.floor(Math.random() * animeDatabase.length)];
            
            // Башка туура эмес 3 анимени вариант үчүн тандайбыз
            let wrongOptions = animeDatabase.filter(item => item.name !== correctObj.name);
            wrongOptions.sort(() => Math.random() - 0.5);
            
            let options = [correctObj.name, wrongOptions[0].name, wrongOptions[1].name, wrongOptions[2].name];
            options.sort(() => Math.random() - 0.5); // Варианттарды аралаштыруу

            currentQuestion = {
                correct: correctObj.name,
                emoji: correctObj.emoji,
                options: options
            };

            // Экранга чыгаруу
            document.getElementById("animeEmoji").innerText = currentQuestion.emoji;

            let container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            currentQuestion.options.forEach(optionText => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(optionText, currentQuestion.correct, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            let msg = document.getElementById("msgText");
            
            if (selected === correct) {
                score += 10;
                msg.style.color = "#2ed573";
                msg.innerText = "Верно! Отлично!";
                btn.style.background = "#2ed573";
                
                currentLevelIndex++;
                setTimeout(() => {
                    loadLevel();
                }, 800);
            } else {
                msg.style.color = "#ff4757";
                msg.innerText = "Неправильно! Попробуйте снова.";
                btn.style.background = "#ff4757";
            }
        }

        loadLevel();
    </script>

</body>
</html>

            <button class="btn-option" onclick="checkAnswer(3)">Берсерк</button>
        </div>
        <div id="msg" style="margin-top: 10px; font-weight: bold; font-size: 14px;"></div>
    </div>

    <!-- СКАЧАТЬ КЫЛУУЧУ БӨЛҮК -->
    <div class="download-section">
        <h2>Моя игра</h2>
        <p>Хотите играть на телефоне без интернета? Скачайте APK файл:</p>
        <a href="app-release.apk" download class="btn-download">Скачать игру</a>
    </div>

    <script>
        const levels = [
            { emojis: "💀🧱", answers: ["Ванпанчмен", "Атака Титанов", "Клинок, рассекающий демонов", "Берсерк"], correct: 3 },
            { emojis: "🏴‍☠️👒", answers: ["Ванпанчмен", "Атака Титанов", "Волейбол", "Ван Пис"], correct: 3 },
            { emojis: "🎾🏆", answers: ["Ван Пис", "Евангелион", "Волейбол", "Атака Титанов"], correct: 2 }
        ];

        let currentLevel = 0;
        let score = 0;

        function loadLevel() {
            if (currentLevel >= levels.length) {
                currentLevel = 0;
            }
            let lvl = levels[currentLevel];
            document.getElementById("question").innerText = lvl.emojis;
            document.getElementById("stats").innerText = `Уровень: ${currentLevel + 1} | Очки: ${score}`;
            
            let optsDiv = document.getElementById("options");
            optsDiv.innerHTML = "";
            lvl.answers.forEach((ans, idx) => {
                let btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(idx, lvl.correct);
                optsDiv.appendChild(btn);
            });
            document.getElementById("msg").innerText = "";
        }

        function checkAnswer(selected, correctIdx) {
            let msg = document.getElementById("msg");
            if (selected === correctIdx) {
                msg.style.color = "#4ade80";
                msg.innerText = "Правильно! 🎉";
                score += 10;
                currentLevel++;
                setTimeout(loadLevel, 800);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "Неправильно! ❌";
                setTimeout(loadLevel, 800);
            }
        }
    </script>
